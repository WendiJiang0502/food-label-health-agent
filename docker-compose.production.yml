services:
  food-label-agent:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      FOOD_LABEL_SITE_ACCESS_TOKEN: "${FOOD_LABEL_SITE_ACCESS_TOKEN:?必须设置站点访问令牌}"
      FOOD_LABEL_DISCOVERY_ADMIN_TOKEN: "${FOOD_LABEL_DISCOVERY_ADMIN_TOKEN:?必须设置发现队列管理员令牌}"
      FOOD_LABEL_DATA_DIR: /app/data
    ports:
      - "${FOOD_LABEL_PUBLISH_PORT:-8000}:8000"
    volumes:
      - food-label-data:/app/data
      - ${TENCENT_CREDENTIALS_FILE:-~/.tencentcloud/credentials}:/home/foodlabel/.tencentcloud/credentials:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  food-label-data:
