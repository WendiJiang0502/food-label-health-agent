services:
  food-label-agent:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "8000:8000"
    volumes:
      - food-label-data:/root/.local/share/food-label-health-agent
      - ${TENCENT_CREDENTIALS_FILE:-~/.tencentcloud/credentials}:/root/.tencentcloud/credentials:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  food-label-data:
