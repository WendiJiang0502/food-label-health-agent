[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "food-label-health-agent"
version = "0.1.0"
description = "Evidence-grounded food label health interpretation agent"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Proprietary" }
dependencies = [
  "langgraph>=1.2,<2",
  "mcp>=1.27,<2",
  "pydantic>=2.13,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
food-label-agent = "food_label_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
