[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "food-label-health-agent"
version = "0.3.0"
description = "Evidence-grounded food label health interpretation agent"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Proprietary" }
dependencies = [
  "langgraph>=1.2,<2",
  "mcp>=1.27,<2",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "pdfplumber>=0.11,<1",
  "pypdf>=6,<7",
  "pydantic>=2.13,<3",
  "python-multipart>=0.0.20,<1",
  "starlette>=1.3,<2",
  "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
ocr = [
  "paddleocr==3.7.0",
  "paddlex[ocr]==3.7.2",
]
cloud-ocr = [
  "tencentcloud-sdk-python-ocr>=3.1.132,<4",
]
dev = [
  "bandit[toml]>=1.8,<2",
  "cyclonedx-bom>=7,<8",
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pip-audit>=2.9,<3",
  "playwright>=1.55,<2",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
food-label-agent = "food_label_agent.__main__:main"
food-label-mcp = "food_label_agent.mcp.server:run"
food-label-platform = "food_label_agent.web.app:run"
food-label-ocr-eval = "food_label_agent.evaluation.ocr:main"
food-label-eval = "food_label_agent.evaluation.suite:main"
food-label-planner-eval = "food_label_agent.evaluation.planner:main"
food-label-rag-eval = "food_label_agent.evaluation.rag_ablation:main"
food-label-regulations-ingest = "food_label_agent.regulations.cli:main"
food-label-packaging-evidence = "food_label_agent.alternatives.packaging_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
food_label_agent = [
  "alternatives/data/*.json",
  "evaluation/data/*.json",
  "regulations/data/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["food_label_agent"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
files = [
  "src/food_label_agent/alternatives/models.py",
  "src/food_label_agent/alternatives/evidence_audit.py",
  "src/food_label_agent/alternatives/discovery.py",
  "src/food_label_agent/evaluation/suite.py",
]
