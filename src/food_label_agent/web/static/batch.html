<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>食鉴 · 商品资料批次复核</title><link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/batch.css"></head><body><main class="batch-shell">
<header><a href="/">返回食鉴</a><h1>商品资料批次复核</h1><p>集中处理缺失与来源差异。采用字段只代表本次资料复核，不会自动授予过敏安全判断或最终推荐资格。</p></header>
<section aria-label="筛选与访问"><div class="batch-controls"><label>管理员令牌（本地未配置时可留空）<input id="token" type="password" autocomplete="off"></label><label>搜索商品或条形码<input id="query" type="search"></label><label>类别<select id="category"><option value="">全部类别</option><option value="breakfast_cereal">早餐谷物</option><option value="dairy">乳制品</option><option value="drink">饮品</option></select></label><label>问题类型<select id="reason"><option value="">全部问题</option><option value="conflicting_sources">来源冲突</option><option value="identity_incomplete">身份不完整</option><option value="identity_changed">身份变化</option><option value="missing_source_field">来源缺字段</option><option value="basis_unknown">计量口径不明</option><option value="needs_review">待字段复核</option><option value="source_stale">来源过期</option></select></label></div><button id="load" type="button">加载批次</button><p id="summary" aria-live="polite">加载后查看字段能力与待处理数量。</p></section>
<section aria-label="复核操作"><div class="batch-controls"><label>本次复核字段<select id="field"><option value="identity">商品身份</option><option value="ingredients">配料表</option><option value="sugars">糖</option><option value="protein">蛋白质</option><option value="fat">脂肪</option><option value="sodium">钠</option><option value="energy">能量</option><option value="saturated_fat">饱和脂肪</option><option value="dietary_fiber">膳食纤维</option></select></label><label>复核人标识<input id="reviewer" maxlength="80" placeholder="例如：reviewer-01"></label><label>依据或备注<input id="note" maxlength="1000"></label></div><p>逐条勾选商品，核对身份和包装后，选择要采用的字段原文。存在冲突或身份变化时请单独处理。</p><div class="batch-actions"><button id="select-clean" type="button">选择本页唯一且无冲突的依据</button><button data-action="adopt">采用所选证据</button><button data-action="defer">标记稍后复核</button><button data-action="retry">加入月度重试队列</button></div><p id="message" role="status"></p></section>
<section id="items" aria-label="商品证据"></section><nav class="batch-actions" aria-label="分页"><button id="previous">上一批</button><span id="page"></span><button id="next">下一批</button></nav>
</main><script src="/static/batch.js"></script></body></html>
