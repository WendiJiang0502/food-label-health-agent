<!--
THESIS: A food package becomes understandable the moment its label enters the workbench.
OWN-WORLD: Warm paper, editorial navy type, tactile package photography, and offset functional Bento cards.
STORY: The user uploads a label, checks the extracted text, and confirms it.
FIRST VIEWPORT: A concise promise and one primary action sit beside the live upload workbench; no internal Agent architecture is exposed.
FORM: Editorial utility Bento, adapted from the user-pinned Nova Benefits reference without copying its assets or product metaphors.
-->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="上传食品标签，确认识别文字，再进行基于证据的健康信息解释。">
    <title>食鉴 · 食品标签健康解释</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/styles.css?v=editorial-bento-1">
    <script src="/static/app.js?v=editorial-bento-2" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#workspace">跳到标签工作区</a>

    <header class="topbar">
      <a class="brand" href="/" aria-label="食鉴首页">
        <span class="brand-mark" aria-hidden="true">食</span>
        <span>
          <strong>食鉴</strong>
          <small>LabelLens Health</small>
        </span>
      </a>

      <div class="topbar-status" aria-label="平台状态">
        <span class="privacy-mark" data-privacy-status>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 10V8a5 5 0 0 1 10 0v2m-11 0h12v10H6V10Zm6 4v3" />
          </svg>
          图片默认不保存
        </span>
        <span class="demo-mark" id="ocr-status">演示 OCR</span>
      </div>
    </header>

    <main>
      <div class="hero-layout" id="hero-layout">
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow">食品标签解释 Agent</p>
          <h1 id="page-title">看懂标签，<br>再决定吃什么。</h1>
          <p class="intro-copy">拍下配料表，先核对文字，再查看配料与过敏原信息。</p>
          <button class="button button--hero" id="hero-upload-button" type="button">
            上传食品标签
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
          </button>
          <p class="intro-note">支持配料表、营养成分表与过敏原提示</p>
        </section>

        <section class="workbench" id="workspace" aria-label="食品标签上传与校对工作区">
        <div class="proof-column">
          <div class="proof-header">
            <div>
              <span class="section-index">01</span>
              <h2 id="proof-title">把标签放进来</h2>
            </div>
            <span class="proof-state" id="proof-state">等待图片</span>
          </div>

          <div class="proof-sheet" id="proof-sheet">
            <div class="crop-mark crop-mark--tl" aria-hidden="true"></div>
            <div class="crop-mark crop-mark--tr" aria-hidden="true"></div>
            <div class="crop-mark crop-mark--bl" aria-hidden="true"></div>
            <div class="crop-mark crop-mark--br" aria-hidden="true"></div>

            <label class="drop-zone" id="drop-zone" for="label-image">
              <input
                id="label-image"
                name="image"
                type="file"
                accept="image/jpeg,image/png,image/webp,image/heic,image/heif"
              >
              <span class="package-visual" aria-hidden="true">
                <img src="/static/assets/label-pouch.png?v=editorial-bento-1" alt="">
              </span>
              <span class="upload-copy">
                <span class="upload-symbol" aria-hidden="true">
                  <svg viewBox="0 0 32 32">
                    <path d="M16 22V6m0 0-6 6m6-6 6 6M6 20v6h20v-6" />
                  </svg>
                </span>
                <strong>拍照或上传</strong>
                <span>让配料文字清晰入镜</span>
                <span class="file-rules">JPG · PNG · WEBP · HEIC · 最大 10 MB</span>
              </span>
            </label>

            <div class="image-stage" id="image-stage" hidden>
              <img
                id="label-preview"
                src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="
                alt="待识别的食品标签预览"
              >
              <div class="annotation-layer" id="annotation-layer" aria-label="OCR 字段位置"></div>
              <button class="replace-image" id="replace-image" type="button">更换图片</button>
            </div>

            <div class="processing" id="processing" hidden aria-live="polite">
              <span class="processing-line" aria-hidden="true"></span>
              <strong>正在建立标签校样</strong>
              <span>读取版面、配料和过敏原声明…</span>
            </div>
          </div>

          <div class="proof-footnotes">
            <p class="proof-note" id="ocr-proof-note"><strong>演示版</strong> · OCR 结果仅用于测试交互</p>
            <p class="privacy-note" data-privacy-status>图片默认不保存</p>
          </div>

          <div class="error-state" id="error-state" hidden role="alert">
            <strong>没有完成识别</strong>
            <p id="error-message"></p>
            <button class="text-button" id="retry-button" type="button">重新尝试</button>
          </div>
        </div>

        <aside class="review-rail" id="review-rail" aria-labelledby="review-title" hidden>
          <div class="review-heading">
            <h2 id="review-title">确认识别文字</h2>
            <span class="review-count" id="review-count">0 项</span>
          </div>

          <form id="confirmation-form" hidden novalidate>
            <div class="field-list" id="field-list"></div>

            <div class="confirmation-actions">
              <button class="button button--primary" id="confirm-button" type="submit">
                确认识别文字
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m9 5 7 7-7 7" />
                </svg>
              </button>
            </div>
          </form>

          <div class="result-state" id="result-state" hidden tabindex="-1">
            <span class="result-symbol" aria-hidden="true">✓</span>
            <div>
              <h3>识别文字已确认</h3>
              <p id="result-message">已完成确认。</p>
            </div>
          </div>
        </aside>
        </section>
      </div>
    </main>

    <footer>
      <p>食鉴提供标签信息整理与解释，不构成医疗诊断或治疗建议。</p>
    </footer>

    <div class="sr-only" id="live-region" aria-live="polite"></div>
  </body>
</html>
