name: Evaluation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deterministic-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Static checks
        run: ruff check src tests
      - name: Test suite
        run: pytest -q
      - name: Milestone 6 deterministic evaluation
        run: >-
          food-label-eval --profile development
          --json evaluation.json --markdown evaluation.md
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-6-evaluation
          path: |
            evaluation.json
            evaluation.md
