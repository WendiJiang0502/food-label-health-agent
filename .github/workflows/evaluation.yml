name: Evaluation

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deterministic-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Static checks
        run: ruff check src tests
      - name: Critical-path static types
        run: mypy
      - name: Test suite and coverage gate
        run: >-
          pytest -q --cov=food_label_agent --cov-branch
          --cov-report=term-missing --cov-report=xml:coverage.xml
          --cov-fail-under=70
      - name: Milestone 6 deterministic evaluation
        run: >-
          food-label-eval --profile development
          --json evaluation.json --markdown evaluation.md
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-6-evaluation
          path: |
            evaluation.json
            evaluation.md
            coverage.xml

  security-engineering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install application and security tooling
        run: python -m pip install -e '.[dev]'
      - name: Dependency vulnerability gate
        run: pip-audit . --strict
      - name: High-severity Python SAST gate
        run: bandit -q -lll -r src
      - name: Generate CycloneDX SBOM
        if: always()
        run: cyclonedx-py environment --output-format JSON --output-file sbom.json
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-cyclonedx-sbom
          path: sbom.json
          if-no-files-found: error

  browser-accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install app and browser
        run: |
          python -m pip install -e '.[dev]'
          python -m playwright install --with-deps chromium
          npm install --prefix /tmp/food-label-a11y axe-core@4.13.0
      - name: Start local evaluation surface
        run: |
          python -m uvicorn food_label_agent.web.app:app --host 127.0.0.1 --port 8765 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8765/api/ready && break
            sleep 1
          done
      - name: WCAG axe gate
        run: >-
          python scripts/check_accessibility.py http://127.0.0.1:8765
          /tmp/food-label-a11y/node_modules/axe-core/axe.min.js
      - name: Mobile 200 percent text resize gate
        run: python scripts/check_text_zoom.py http://127.0.0.1:8765
